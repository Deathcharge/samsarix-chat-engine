name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  kubernetes-preview:
    uses: ./.github/workflows/kubernetes-preview.yml

  postgres-pitr-rehearsal:
    uses: ./.github/workflows/postgres-pitr-rehearsal.yml

  postgres-restore-rehearsal:
    uses: ./.github/workflows/postgres-restore-rehearsal.yml

  postgres-load:
    strategy:
      fail-fast: false
      matrix:
        scenario: [steady, count, age, retained-gap, reconnect-storm]
    uses: ./.github/workflows/postgres-load.yml
    with:
      scenario: ${{ matrix.scenario }}
      duration: 180
      rate: 20
      clients_per_room: 8

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e ".[postgres,test]"
      - run: python -m pytest --timeout=60

  sqlite-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m venv .venv-sqlite-only
      - run: .venv-sqlite-only/bin/python -m pip install -e ".[test]"
      - run: .venv-sqlite-only/bin/python -m pip check
      - name: Ensure the optional PostgreSQL driver is genuinely absent
        run: .venv-sqlite-only/bin/python -c "import importlib.util; assert importlib.util.find_spec('psycopg') is None"
      - run: .venv-sqlite-only/bin/python -m pytest --timeout=60

  postgres-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
        env:
          POSTGRES_DB: samsarix_test
          POSTGRES_PASSWORD: postgres-ci-password
          POSTGRES_USER: samsarix_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U samsarix_ci -d samsarix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SAMSARIX_TEST_POSTGRES_URL: postgresql://samsarix_ci:postgres-ci-password@127.0.0.1:5432/samsarix_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e ".[postgres,test]"
      - run: python -m pytest -m postgres --timeout=90

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
        env:
          POSTGRES_DB: samsarix_test
          POSTGRES_PASSWORD: postgres-ci-password
          POSTGRES_USER: samsarix_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U samsarix_ci -d samsarix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SAMSARIX_TEST_POSTGRES_URL: postgresql://samsarix_ci:postgres-ci-password@127.0.0.1:5432/samsarix_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy samsarix_chat_engine
      - run: python scripts/verify_kubernetes_preview.py
      - run: python -m pip_audit
      - run: python -m pytest --cov=samsarix_chat_engine --cov-report=term-missing --timeout=90
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m venv .wheel-smoke
      - run: .wheel-smoke/bin/python -m pip install dist/*.whl
      - run: .wheel-smoke/bin/python scripts/smoke_installed_wheel.py

  typescript-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip setuptools wheel
        working-directory: .
      - run: python -m pip install .
        working-directory: .
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run pack:check
      - run: npm audit --omit=dev
      - run: python scripts/smoke_typescript_client.py
        working-directory: .

  container-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and smoke the hardened Compose deployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p secrets
          printf '%s' 'container-ci-operator-key-123456' > secrets/operator-api-key.txt
          printf '%s' 'container-ci-token-signing-secret-32-bytes' > secrets/token-signing-secret.txt
          docker compose config --quiet
          docker compose build --pull
          docker run --rm --entrypoint python samsarix-chat-engine:0.12.0 -c 'import psycopg; print(psycopg.__version__)'

          cleanup() {
            docker compose logs --no-color || true
            docker compose down --volumes --remove-orphans || true
          }
          trap cleanup EXIT
          docker compose up --detach

          container_id=$(docker compose ps --quiet chat)
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/readyz > /dev/null \
              && [ "$(docker inspect --format '{{.State.Health.Status}}' "$container_id")" = 'healthy' ]; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo 'container did not become ready' >&2
              exit 1
            fi
            sleep 1
          done

          test "$(docker inspect --format '{{.Config.User}}' "$container_id")" = '10001:10001'
          if docker compose exec -T chat sh -c 'touch /root-filesystem-must-remain-read-only'; then
            echo 'container root filesystem was writable' >&2
            exit 1
          fi

          curl --fail --silent --show-error \
            --header 'X-API-Key: container-ci-operator-key-123456' \
            --header 'Content-Type: application/json' \
            --data '{"id":"container-room","name":"Container Room"}' \
            http://127.0.0.1:8000/v1/rooms > /dev/null

          docker compose restart chat
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error \
              --header 'X-API-Key: container-ci-operator-key-123456' \
              http://127.0.0.1:8000/v1/rooms/container-room > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo 'persisted room did not recover after restart' >&2
              exit 1
            fi
            sleep 1
          done
