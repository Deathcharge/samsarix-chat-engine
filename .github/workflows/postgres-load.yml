name: PostgreSQL measured workload

on:
  workflow_call:
    inputs:
      scenario:
        type: string
        default: steady
      duration:
        type: number
        default: 180
      rate:
        type: number
        default: 20
      clients_per_room:
        type: number
        default: 8
  workflow_dispatch:
    inputs:
      scenario:
        description: Fault to inject while writes continue
        type: choice
        options: [steady, count, age, retained-gap, reconnect-storm]
        default: steady
      duration:
        description: Scheduled workload seconds (1-1800; faults require 180)
        type: number
        default: 900
      rate:
        description: Create cycles per second (at most 20000 per run)
        type: number
        default: 20
      clients_per_room:
        description: Even subscribers per room (four rooms, at most 128 total)
        type: number
        default: 8

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
        env:
          POSTGRES_DB: samsarix_test
          POSTGRES_PASSWORD: postgres-ci-password
          POSTGRES_USER: samsarix_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U samsarix_ci -d samsarix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SAMSARIX_TEST_POSTGRES_URL: postgresql://samsarix_ci:postgres-ci-password@127.0.0.1:5432/samsarix_test
      LOAD_SCENARIO: ${{ inputs.scenario }}
      LOAD_DURATION: ${{ inputs.duration }}
      LOAD_RATE: ${{ inputs.rate }}
      LOAD_CLIENTS_PER_ROOM: ${{ inputs.clients_per_room }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -e ".[postgres,test]"
      - name: Measure the real processes and validate recovery
        shell: bash
        run: |
          python -m scripts.load_postgres \
            --allow-reset-test-database \
            --scenario "$LOAD_SCENARIO" --duration "$LOAD_DURATION" \
            --rate "$LOAD_RATE" --clients-per-room "$LOAD_CLIENTS_PER_ROOM" \
            --output dist/load-report.json
      - name: Preserve measured results, including failed acceptance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-load-${{ inputs.scenario }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/load-report.json
          if-no-files-found: warn
          retention-days: 30
