name: Release artifacts

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Require a release-ready tag on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"
          python scripts/validate_release.py --tag "$RELEASE_TAG"
      - run: python -m pip install "pip==26.2.1"
      - run: >-
          python -m pip install
          "build==1.6.0"
          "setuptools==84.0.0"
          "twine==6.2.0"
          "wheel==0.47.0"
      - run: python -m build --no-isolation
      - run: python -m twine check dist/*
      - name: Smoke the wheel outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/samsarix-release-smoke"
          "$RUNNER_TEMP/samsarix-release-smoke/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/samsarix-release-smoke/bin/python" scripts/smoke_installed_wheel.py
      - name: Write release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- *.whl *.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Attest the distributions and checksum manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Preserve release candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish-github:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the attested release candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.ref_name }}
          path: dist
      - name: Verify checksums before publication
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS
      - name: Create the versioned GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --generate-notes \
            --title "Samsarix Chat Engine $RELEASE_TAG"
