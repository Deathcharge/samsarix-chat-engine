# Disposable CI-only PostgreSQL provider for the Kubernetes preview acceptance test.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres-acceptance
    app.kubernetes.io/component: database
spec:
  selector:
    app.kubernetes.io/name: postgres-acceptance
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-acceptance
  labels:
    app.kubernetes.io/name: postgres-acceptance
    app.kubernetes.io/component: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-acceptance
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-acceptance
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -ec
            - |
              install -d -o postgres -g postgres -m 0700 /var/lib/postgresql/tls
              install -o postgres -g postgres -m 0644 /tls-source/server.crt /var/lib/postgresql/tls/server.crt
              install -o postgres -g postgres -m 0600 /tls-source/server.key /var/lib/postgresql/tls/server.key
              exec docker-entrypoint.sh postgres \
                -c ssl=on \
                -c ssl_cert_file=/var/lib/postgresql/tls/server.crt \
                -c ssl_key_file=/var/lib/postgresql/tls/server.key
          env:
            - name: POSTGRES_DB
              value: samsarix
            - name: POSTGRES_USER
              value: samsarix
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/postgres-password
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          startupProbe:
            exec:
              command:
                - pg_isready
                - -U
                - samsarix
                - -d
                - samsarix
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - samsarix
                - -d
                - samsarix
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - samsarix
                - -d
                - samsarix
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETGID
                - SETUID
          volumeMounts:
            - name: postgres-password
              mountPath: /run/secrets
              readOnly: true
            - name: postgres-tls-source
              mountPath: /tls-source
              readOnly: true
            - name: postgres-tls
              mountPath: /var/lib/postgresql/tls
      volumes:
        - name: postgres-password
          secret:
            secretName: postgres-acceptance-auth
            defaultMode: 0440
            items:
              - key: password
                path: postgres-password
        - name: postgres-tls-source
          secret:
            secretName: postgres-acceptance-tls
            defaultMode: 0440
        - name: postgres-tls
          emptyDir: {}
