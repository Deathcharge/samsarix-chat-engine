[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "samsarix-chat-engine"
version = "0.12.0"
description = "Embeddable, access-controlled room chat over HTTP, WebSockets, and SQLite"
readme = "README.md"
requires-python = ">=3.10"
license = "MPL-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    {name = "Samsarix LLC", email = "contact@samsarix.com"},
]
maintainers = [
    {name = "Samsarix Support", email = "support@samsarix.com"},
]
keywords = ["chat", "fastapi", "jwks", "sqlite", "webhook", "websocket"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "anyio>=4,<5",
    "fastapi>=0.140,<1.0",
    "PyJWT>=2.13,<3",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
asymmetric-auth = [
    "cryptography>=50,<51",
]
postgres = [
    "psycopg[binary,pool]>=3.3,<4",
]
test = [
    "cryptography>=50,<51",
    "httpx2>=2,<3",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2.0",
    "pytest-cov>=5,<8",
    "pytest-timeout>=2.4,<3",
    "websockets>=13,<18",
]
dev = [
    "build>=1.2,<2.0",
    "cryptography>=50,<51",
    "httpx2>=2,<3",
    "mypy>=1.11,<2.0",
    "pip-audit>=2.10,<3.0",
    "psycopg[binary,pool]>=3.3,<4",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2.0",
    "pytest-cov>=5,<8",
    "pytest-timeout>=2.4,<3",
    "ruff>=0.8,<1.0",
    "setuptools>=83",
    "twine>=5,<7",
    "websockets>=13,<18",
]

[project.scripts]
samsarix-chat = "samsarix_chat_engine.cli:main"
helix-chat = "samsarix_chat_engine.cli:main"

[project.urls]
Homepage = "https://samsarix.com"
Repository = "https://github.com/Deathcharge/samsarix-chat-engine.git"
Issues = "https://github.com/Deathcharge/samsarix-chat-engine/issues"
Support = "https://samsarix.com"

[tool.setuptools.packages.find]
include = ["samsarix_chat_engine*", "helix_chat_engine*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "postgres: requires the dedicated live PostgreSQL test database",
]

[tool.coverage.run]
branch = true
source = ["samsarix_chat_engine"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
exclude = "^(build|dist)/"
