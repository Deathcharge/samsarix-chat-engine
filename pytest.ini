[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    message: test message functionality
    room: test room functionality
    websocket: test WebSocket functionality
    server: test server functionality
    event: test event functionality
    connection: test connection functionality
    integration: test integration scenarios
